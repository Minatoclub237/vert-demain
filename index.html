    <!-- Écran de chargement. Il vit dans le HTML et non dans React : sinon il
         n'apparaîtrait qu'après le chargement du bundle, donc après que le hero
         a déjà peint. Styles en ligne pour la même raison — Tailwind n'est pas
         encore là. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #3b332a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #app-loader[data-done='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .al-bg {
        position: absolute;
        inset: -5%;
        width: 110%;
        height: 110%;
        object-fit: cover;
        filter: blur(18px) brightness(0.55);
      }
      #app-loader .al-mark {
        position: relative;
        max-height: 70vmin;
        max-width: 88vw;
        width: auto;
        border-radius: 2px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.75);
      }
      #app-loader .al-bar {
        position: relative;
        width: 10rem;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.2);
      }
      #app-loader .al-bar i {
        display: block;
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        animation: al-sweep 1.1s ease-in-out infinite;
      }
      @keyframes al-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader { transition: none; }
        #app-loader .al-bar i { width: 100%; animation: none; }
      }
    </style>
    <link rel="canonical" href="https://vdh-construct.vercel.app/" />
    <link rel="alternate" hreflang="fr-BE" href="https://vdh-construct.vercel.app/" />
    <link rel="alternate" hreflang="nl-BE" href="https://vdh-construct.vercel.app/nl/" />
    <link rel="alternate" hreflang="x-default" href="https://vdh-construct.vercel.app/" />
    <meta property="og:locale:alternate" content="nl_BE">

</head>
  <body>
    <div id="app-loader" role="status" aria-label="Chargement du site VDH Construct">
      <img class="al-bg" src="/loader-3d.jpg" alt="" aria-hidden="true" />
      <img class="al-mark" src="/loader-3d.jpg" alt="VDH Construct &amp; Aménagements Extérieurs" />
      <div class="al-bar"><i></i></div>
    </div>

    <script>
      (function () {
        var el = document.getElementById('app-loader');
        if (!el) return;
        var MIN = 700, started = Date.now(), fired = false;
        function hide() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            el.setAttribute('data-done', 'true');
            setTimeout(function () { el.remove(); }, 600);
          }, Math.max(0, MIN - (Date.now() - started)));
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide, { once: true });
        setTimeout(hide, 6000); // une vidéo lente ne doit pas bloquer l'écran
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
