    <!-- Écran de chargement. Il vit dans le HTML et non dans React : sinon il
         n'apparaîtrait qu'après le chargement du bundle, donc après que le hero
         a déjà peint. Styles en ligne pour la même raison — Tailwind n'est pas
         encore là. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #133201;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #app-loader[data-done='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .al-mark {
        position: relative;
        width: min(22rem, 70vw);
        height: auto;
      }
      #app-loader .al-bar {
        position: relative;
        width: 10rem;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(191, 255, 86, 0.2);
      }
      #app-loader .al-bar i {
        display: block;
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: #BFFF56;
        animation: al-sweep 1.1s ease-in-out infinite;
      }
      @keyframes al-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader { transition: none; }
        #app-loader .al-bar i { width: 100%; animation: none; }
      }
    </style>
    <!-- TODO : canonical et og:url à poser quand le domaine de production sera connu. -->

</head>
  <body>
    <div id="app-loader" role="status" aria-label="Chargement du site Vert Demain">
      <img class="al-mark" src="/logo-citron.svg" alt="Vert Demain" />
      <div class="al-bar"><i></i></div>
    </div>

    <script>
      (function () {
        var el = document.getElementById('app-loader');
        if (!el) return;
        var MIN = 700, started = Date.now(), fired = false;
        function hide() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            el.setAttribute('data-done', 'true');
            setTimeout(function () { el.remove(); }, 600);
          }, Math.max(0, MIN - (Date.now() - started)));
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide, { once: true });
        setTimeout(hide, 6000); // une vidéo lente ne doit pas bloquer l'écran
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
