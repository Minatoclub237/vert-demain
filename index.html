    <!-- Écran d'entrée. Il vit dans le HTML et non dans React : sinon il n'apparaîtrait
         qu'après le chargement du bundle, donc après que le hero a déjà peint. Styles et
         script en ligne pour la même raison — Tailwind n'est pas encore là.
         Déroulé : un anneau de croissance se dessine au rythme du chargement réel, le
         visuel du client s'ouvre en cercle depuis le centre et sort du flou, un reflet
         glisse sur le relief du papier, des feuilles montent dans le vent. Une fois la
         page chargée, le visuel recule et l'écran se soulève avec un bord arrondi — le
         même geste que les sections qui se recouvrent — pendant que le hero s'anime. -->
    <link rel="preload" as="image" href="/chargement.webp" fetchpriority="high" />
    <style>
      /* le hero attend la fin de l'entrée pour jouer ses animations */
      html.vd-chargement { overflow: hidden; scrollbar-gutter: stable; }
      html.vd-chargement .animate-fade-up,
      html.vd-chargement .animate-fade-in,
      html.vd-chargement .animate-scale-in,
      html.vd-chargement .animate-border-draw { animation-play-state: paused; }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        /* même éclairage que le visuel : clair en haut à gauche, sombre en bas à droite */
        background:
          radial-gradient(120% 90% at 18% 10%, #62854d 0%, rgba(98, 133, 77, 0) 55%),
          linear-gradient(135deg, #4a7531 0%, #2f5a14 48%, #193609 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
        transition:
          transform 1.05s cubic-bezier(0.76, 0, 0.24, 1) 0.12s,
          border-radius 1.05s cubic-bezier(0.76, 0, 0.24, 1) 0.12s;
      }
      #app-loader[data-sortie] {
        transform: translate3d(0, -104%, 0);
        border-radius: 0 0 50% 50% / 0 0 16vh 16vh;
      }

      .vd-scene {
        position: relative;
        width: min(78vmin, 640px);
        aspect-ratio: 1;
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
      }
      @media (max-width: 640px) {
        .vd-scene { width: min(88vw, 62vh); }
      }
      /* le visuel monte avec l'écran au lieu de s'effacer avant lui */
      #app-loader[data-sortie] .vd-scene { transform: scale(0.9) translate3d(0, -4%, 0); }

      /* le visuel, entier ; seule sa marge verte unie se fond dans le fond */
      .vd-respire { position: absolute; inset: 0; animation: vd-respire 3.2s ease-in-out 1.6s infinite alternate; }
      .vd-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -webkit-mask-image: radial-gradient(circle closest-side at 50% 49.4%, #000 86%, transparent 100%);
        mask-image: radial-gradient(circle closest-side at 50% 49.4%, #000 86%, transparent 100%);
        animation: vd-ouvre 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
      }
      .vd-reflet {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        -webkit-mask-image: radial-gradient(circle closest-side at 50% 49.4%, #000 82%, transparent 83%);
        mask-image: radial-gradient(circle closest-side at 50% 49.4%, #000 82%, transparent 83%);
        background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.34) 50%, transparent 62%) no-repeat;
        background-size: 260% 100%;
        background-position: 160% 0;
        mix-blend-mode: soft-light;
        animation: vd-reflet 1.4s cubic-bezier(0.45, 0, 0.2, 1) 1.25s both;
      }

      /* anneau de croissance = progression réelle du chargement */
      .vd-anneau {
        position: absolute;
        inset: -2%;
        width: 104%;
        height: 104%;
        overflow: visible;
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      }
      #app-loader[data-sortie] .vd-anneau { transform: scale(1.18); opacity: 0; }
      .vd-anneau circle { fill: none; }
      .vd-anneau .piste { stroke: rgba(255, 251, 243, 0.12); stroke-width: 0.35; }
      .vd-anneau .trace {
        stroke: #bfff56;
        stroke-width: 0.55;
        stroke-linecap: round;
        stroke-dasharray: 100 100;
        stroke-dashoffset: 100;
        filter: drop-shadow(0 0 1.2px rgba(191, 255, 86, 0.8));
      }
      .vd-anneau .tete { fill: #bfff56; filter: drop-shadow(0 0 1.6px #bfff56); }

      .vd-legende {
        position: absolute;
        left: 50%;
        top: calc(100% + clamp(10px, 2.4vmin, 22px));
        transform: translateX(-50%);
        white-space: nowrap;
        font: 600 clamp(10px, 1.5vmin, 12px) / 1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-transform: uppercase;
        color: rgba(255, 251, 243, 0.82);
        animation: vd-legende 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.1s both;
      }

      /* feuilles qui montent dans le vent */
      .vd-feuille {
        position: absolute;
        left: var(--x);
        bottom: -12vh;
        width: var(--l);
        height: var(--l);
        color: var(--c);
        opacity: 0;
        animation: vd-monte var(--t) cubic-bezier(0.35, 0.1, 0.4, 1) var(--d) infinite;
        pointer-events: none;
      }
      .vd-feuille svg { width: 100%; height: 100%; animation: vd-balance calc(var(--t) / 3) ease-in-out infinite alternate; }
      @media (max-width: 640px) { .vd-feuille:nth-of-type(n + 6) { display: none; } }

      @keyframes vd-ouvre {
        from { clip-path: circle(0% at 50% 49.4%); transform: scale(1.16) rotate(-4deg); filter: blur(12px) brightness(0.55); }
        to { clip-path: circle(75% at 50% 49.4%); transform: scale(1) rotate(0); filter: blur(0) brightness(1); }
      }
      @keyframes vd-reflet { from { background-position: 160% 0; } to { background-position: -60% 0; } }
      @keyframes vd-respire { from { transform: scale(1); } to { transform: scale(1.018); } }
      @keyframes vd-legende {
        from { opacity: 0; letter-spacing: 0.7em; }
        to { opacity: 1; letter-spacing: 0.3em; }
      }
      @keyframes vd-monte {
        0% { transform: translate3d(0, 0, 0) rotate(var(--r)); opacity: 0; }
        12% { opacity: var(--o); }
        80% { opacity: var(--o); }
        100% { transform: translate3d(var(--dx), -125vh, 0) rotate(calc(var(--r) + 260deg)); opacity: 0; }
      }
      @keyframes vd-balance { from { transform: translateX(-14px) rotate(-14deg); } to { transform: translateX(14px) rotate(16deg); } }

      @media (prefers-reduced-motion: reduce) {
        .vd-photo, .vd-reflet, .vd-legende, .vd-respire { animation: none; }
        .vd-feuille { display: none; }
        #app-loader { transition: opacity 0.4s ease; }
        #app-loader[data-sortie] { transform: none; border-radius: 0; opacity: 0; }
      }
    </style>
    <!-- TODO : canonical et og:url à poser quand le domaine de production sera connu. -->

</head>
  <body>
    <div id="app-loader" role="status" aria-label="Chargement du site Vert Demain">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="vd-f" viewBox="0 0 24 24">
          <path fill="currentColor" d="M20.5 3.5C12 3.4 5.2 7.4 4 14.6c-.3 1.9.2 3.6 1.1 4.9L3 21.6l1.1 1 2.2-2.1c1.3.8 3 1.2 4.8.9C18.4 20 21.1 12.2 20.5 3.5zM8.2 17.3l7.9-8.2-.6-.6-8 8.1c-.4-1.1-.5-2.2-.2-3.4 1-5 5.8-8.1 12-8.6-.3 6.5-3.6 11.3-8.7 12-1 .2-1.8 0-2.4-.3z" />
        </symbol>
      </svg>
      <span class="vd-feuille" style="--x:8%;--l:34px;--t:7.5s;--d:0.2s;--r:-30deg;--dx:14vw;--o:0.55;--c:#bfff56"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:24%;--l:22px;--t:9s;--d:1.4s;--r:40deg;--dx:-8vw;--o:0.4;--c:#fffbf3"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:71%;--l:30px;--t:8s;--d:0.6s;--r:10deg;--dx:-12vw;--o:0.5;--c:#bfff56"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:88%;--l:20px;--t:10s;--d:2.1s;--r:-60deg;--dx:6vw;--o:0.35;--c:#fffbf3"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:46%;--l:26px;--t:8.6s;--d:2.8s;--r:75deg;--dx:10vw;--o:0.45;--c:#bfff56"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:58%;--l:18px;--t:11s;--d:0.9s;--r:-15deg;--dx:-6vw;--o:0.3;--c:#fffbf3"><svg><use href="#vd-f" /></svg></span>
      <span class="vd-feuille" style="--x:15%;--l:16px;--t:12s;--d:3.4s;--r:20deg;--dx:9vw;--o:0.3;--c:#bfff56"><svg><use href="#vd-f" /></svg></span>

      <div class="vd-scene">
        <div class="vd-respire">
          <img class="vd-photo" src="/chargement.webp" width="1024" height="1024" alt="Vert Demain" fetchpriority="high" decoding="async" />
          <div class="vd-reflet" aria-hidden="true"></div>
        </div>
        <svg class="vd-anneau" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="piste" cx="50" cy="49.4" r="45" />
          <circle class="trace" cx="50" cy="49.4" r="45" pathLength="100" transform="rotate(-90 50 49.4)" />
          <g class="tete-g" transform="rotate(0 50 49.4)"><circle class="tete" cx="50" cy="4.4" r="0.9" /></g>
        </svg>
        <p class="vd-legende">Jardinier paysagiste · Brunoy</p>
      </div>
    </div>

    <script>
      (function () {
        var el = document.getElementById('app-loader');
        if (!el) return;
        var html = document.documentElement;
        html.classList.add('vd-chargement');
        var reduit = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // durée minimale : le temps que l'ouverture et le reflet se jouent en entier
        var MIN = reduit ? 500 : 2600, MAX = 5000, FIN = 400;
        var trace = el.querySelector('.trace'), tete = el.querySelector('.tete-g');
        var debut = performance.now(), fini = false;
        var tPret = null, pPret = 0; // instant où la page est prête, et progression à cet instant

        function sortie() {
          if (fini) return;
          fini = true;
          el.setAttribute('data-sortie', '');
          // le hero démarre pendant que l'écran se soulève
          setTimeout(function () { html.classList.remove('vd-chargement'); }, 200);
          setTimeout(function () { el.remove(); }, 1300);
        }

        // Progression calculée sur l'HORLOGE, pas image par image : sur un téléphone qui
        // affiche peu d'images par seconde, l'anneau n'a plus de retard à rattraper.
        function progression(now) {
          var t = now - debut;
          var attente = 0.9 * (1 - Math.exp(-t / 1100)); // vers 90 % tant que la page prépare
          if (tPret === null) return attente;
          var k = Math.min(1, (now - tPret) / FIN); // puis 100 % en FIN ms, quoi qu'il arrive
          return pPret + (1 - pPret) * (1 - Math.pow(1 - k, 3));
        }

        function image() {
          var now = performance.now(), t = now - debut;
          var p = progression(now);
          trace.style.strokeDashoffset = String(100 - p * 100);
          tete.setAttribute('transform', 'rotate(' + (p * 360).toFixed(2) + ' 50 49.4)');
          if (tPret !== null && now - tPret >= FIN && t >= MIN) return sortie();
          if (t > MAX) return sortie(); // réseau très lent : on n'attend pas plus
          requestAnimationFrame(image);
        }
        requestAnimationFrame(image);

        // « Prête » = le code a tourné (le hero est rendu) et les polices sont là.
        // On n'attend PAS l'événement load : il attend aussi les affiches et images plus bas
        // dans la page, que le visiteur ne voit pas encore.
        function pret() {
          if (tPret !== null) return;
          pPret = progression(performance.now());
          tPret = performance.now();
        }
        function quandDomPret() {
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(pret, pret);
          else pret();
        }
        if (document.readyState !== 'loading') quandDomPret();
        else document.addEventListener('DOMContentLoaded', quandDomPret, { once: true });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
